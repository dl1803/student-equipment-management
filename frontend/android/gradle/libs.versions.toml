# D01-L: nơi khóa phiên bản tập trung của dự án Android (FC 10.2).
# Chỉ khóa những gì bản dựng hiện tại dùng tới. Phiên bản thư viện khác (Material Components,
# Navigation, Glide, MockWebServer...) được khóa khi task đầu tiên dùng đến thư viện đó và phải
# được nhóm duyệt trước (FC 1.4).
# D02-L: khóa plugin sinh client, Retrofit/OkHttp, Gson, gson-fire, lifecycle-viewmodel,
# androidx.annotation và JUnit. Các phiên bản này là đề xuất của Architect, chờ nhóm xác nhận.
[versions]
# AGP 8.13.2 đi cùng Gradle 8.13, JDK 17 trở lên, hỗ trợ compileSdk 36.
agp = "8.13.2"
openapiGenerator = "7.25.0"
retrofit = "3.0.0"
okhttp = "4.12.0"
gson = "2.13.2"
gsonFire = "1.9.0"
lifecycle = "2.10.0"
annotation = "1.9.1"
jakartaAnnotation = "1.3.5"
findbugsJsr305 = "3.0.2"
junit = "4.13.2"

[libraries]
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
gson-fire = { module = "io.gsonfire:gson-fire", version.ref = "gsonFire" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotation" }
findbugs-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "findbugsJsr305" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
