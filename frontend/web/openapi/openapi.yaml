openapi: 3.0.3
info:
  title: API Quản lý mượn trả thiết bị học tập
  version: 1.1.0
  description: |
    API backend của **Hệ thống quản lý mượn trả thiết bị học tập cho sinh viên** (SE100 Nhóm 13), giai đoạn 1.

    Tài liệu này là hợp đồng API (OpenAPI 3.0.3) bám sát `backend-architecture.md` (KT 6, 7, 8), `Backend-Conventions.md` (CV 6, 8, 9, 10), `Authorization.md`, `Usecase.md`, `BusinessRule.md`, `SRS.md`, `DatabaseDesign.md` và `schema.sql`. Giải thích chi tiết và các quyết định thiết kế nằm trong `API-Notes.md`.

    ## Quy ước chung

    - **Base path:** `/api/v1`, chia theo vai trò: `/auth`, `/sv` (sinh viên), `/quay` (nhân viên), `/quan-tri` (quản trị viên), `/anh`. Ngoài tiền tố: `/health`, `/health/ready`.
    - **Xác thực:** `Authorization: Bearer <accessToken>` (JWT HS256, hạn 15 phút). Mọi endpoint cần xác thực trừ `/auth/*` (đăng nhập, làm mới, đăng xuất) và `/health*`.
    - **Phân quyền:** theo vai trò (policy `SinhVien`, `NhanVien`, `QuanTri`, `NhanVienQuanTri`) và theo phòng thiết bị với nhân viên. Mã sinh viên luôn lấy từ token, không nhận từ client.
    - **JSON:** thuộc tính `camelCase` theo từ điển dữ liệu của hồ sơ phân tích (ví dụ `maThietBi`, `ngayGioHenTra`); giá trị enum là chuỗi `SCREAMING_SNAKE_CASE` không dấu.
    - **Thời gian:** `date-time` theo RFC 3339 (UTC, hậu tố `Z`); ngày tính theo ngày lịch múi giờ `Asia/Ho_Chi_Minh`; giờ quầy dạng `HH:mm[:ss]` giờ Việt Nam. Tiền là số nguyên VNĐ.
    - **Phân trang:** `?trang=1&kichThuoc=20` (kichThuoc tối đa 100); phản hồi `{tongSo, trang, kichThuoc, danhSach}`.
    - **Lỗi:** `application/problem+json` (RFC 9457) kèm `maLoi` ổn định và `traceId`. Client phân nhánh theo `maLoi`, không theo `detail`.
    - **Không có `Idempotency-Key`:** chống trùng dựa trên máy trạng thái và ràng buộc CSDL (409 `TRANG_THAI_KHONG_HOP_LE`, `XUNG_DOT_CAP_NHAT`).
servers:
- url: '{scheme}://{host}'
  description: Máy chủ API. Tên miền triển khai (Render) chưa có trong tài liệu nguồn; thay `host` theo môi trường.
  variables:
    scheme:
      default: https
      enum:
      - https
      - http
    host:
      default: localhost
tags:
- name: Hạ tầng
  description: Health check cho Render, không yêu cầu xác thực.
- name: Xác thực
  description: Đăng nhập, làm mới token, đăng xuất (UC-19).
- name: Ảnh
  description: Tải ảnh tình trạng và ảnh danh mục thiết bị lên Supabase Storage.
- name: Sinh viên
  description: 'Chức năng ứng dụng Android của sinh viên: tra cứu, đặt trước, danh sách chờ, lịch sử (UC-01, 02, 03, 05).'
- name: Nhân viên (quầy)
  description: 'Chức năng tại quầy: duyệt, giao, nhận trả, vi phạm, danh sách chờ, bảo trì (UC-06 đến UC-11). Giới hạn theo phòng được cấp quyền.'
- name: Quản trị viên
  description: Danh mục, cấu hình, tài khoản nhân viên, thanh lý, báo cáo (UC-12 đến UC-16).
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Hạ tầng
      operationId: healthSong
      summary: Kiểm tra dịch vụ còn sống
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Không truy vấn CSDL; là đường dẫn health check trên Render. Không yêu cầu xác thực.
      x-uc: []
      x-tham-chieu: KT 14
      security: []
      responses:
        '200':
          description: Dịch vụ đang chạy
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
  /health/ready:
    get:
      tags:
      - Hạ tầng
      operationId: healthSanSang
      summary: Kiểm tra kết nối CSDL
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Kiểm tra kết nối PostgreSQL. Không yêu cầu xác thực (ngoại lệ NFR-01, ĐX-CV-08).
      x-uc: []
      x-tham-chieu: KT 14, CV 10.1
      security: []
      responses:
        '200':
          description: CSDL kết nối được
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
        '503':
          description: Không kết nối được CSDL
          content:
            text/plain:
              schema:
                type: string
                example: Unhealthy
  /api/v1/auth/sinh-vien/dang-nhap:
    post:
      tags:
      - Xác thực
      operationId: authDangNhapSinhVien
      summary: Đăng nhập sinh viên
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Xác thực bằng MSSV và mật khẩu của trường qua `ISchoolDirectory`; hệ thống không lưu mật khẩu sinh viên (BR-08). Đăng nhập thành công làm mới ngay bản ghi sinh viên. Sinh viên không có trạng thái khóa tài khoản (ĐX-PQ-05) và không tự đăng ký.
      x-uc:
      - UC-19
      x-tham-chieu: KT 6.2, 7.1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DangNhapSinhVienRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          description: |-
            Chưa xác thực. Mã lỗi (`maLoi`):
            - `DANG_NHAP_SAI`: Thông tin đăng nhập không đúng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/QuaNhieuYeuCau'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/auth/nhan-vien/dang-nhap:
    post:
      tags:
      - Xác thực
      operationId: authDangNhapNhanVien
      summary: Đăng nhập nhân viên hoặc quản trị viên
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Dùng chung cho nhân viên và quản trị viên. Nhập sai mật khẩu đạt `soLanDangNhapSaiToiDa` thì tài khoản chuyển `TAM_KHOA_DANG_NHAP`; đăng nhập đúng đặt lại bộ đếm về 0 (BR-10).
      x-uc:
      - UC-19
      x-tham-chieu: KT 6.2, 7.4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DangNhapNhanVienRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          description: |-
            Chưa xác thực. Mã lỗi (`maLoi`):
            - `DANG_NHAP_SAI`: Thông tin đăng nhập không đúng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |-
            Không có quyền. Mã lỗi (`maLoi`):
            - `TAI_KHOAN_BI_KHOA`: Tài khoản bị khóa hoặc tạm khóa đăng nhập
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/QuaNhieuYeuCau'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/auth/lam-moi:
    post:
      tags:
      - Xác thực
      operationId: authLamMoi
      summary: Làm mới token
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Đổi refresh token lấy cặp token mới (xoay vòng). Dùng lại refresh token đã xoay vòng thì thu hồi cả chuỗi. Refresh token hết hạn, đã thu hồi hoặc của tài khoản đã bị khóa không dùng được.
      x-uc:
      - UC-19
      x-tham-chieu: KT 6.2, 7.3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LamMoiRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '429':
          $ref: '#/components/responses/QuaNhieuYeuCau'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/auth/dang-xuat:
    post:
      tags:
      - Xác thực
      operationId: authDangXuat
      summary: Đăng xuất
      description: |-
        **Chính sách:** không yêu cầu (ngoại lệ NFR-01).

        Thu hồi refresh token. Xác định phiên bằng refresh token trong body, không yêu cầu access token còn hạn (access token chỉ sống 15 phút).
      x-uc:
      - UC-19
      x-tham-chieu: KT 6.2, 7.3, ĐX-CV-08
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DangXuatRequest'
      responses:
        '204':
          description: Đã thu hồi refresh token
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '429':
          $ref: '#/components/responses/QuaNhieuYeuCau'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/auth/toi:
    get:
      tags:
      - Xác thực
      operationId: authToi
      summary: Thông tin người đăng nhập
      description: |-
        **Chính sách:** `NhanVienQuanTri`.

        Trả vai trò và danh sách phòng được cấp quyền của nhân viên hoặc quản trị viên đang đăng nhập. Sinh viên không dùng endpoint này.
      x-uc:
      - UC-19
      x-tham-chieu: KT 6.2, 7.2
      responses:
        '200':
          description: Thông tin người đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThongTinToi'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenNhanVien'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/anh:
    post:
      tags:
      - Ảnh
      operationId: anhTai
      summary: Tải ảnh lên
      description: |-
        **Chính sách:** `NhanVienQuanTri`.

        Tải một ảnh (multipart/form-data) lên Supabase Storage; trả `maAnh` chưa gắn đối tượng. Ảnh được gắn khi lập phiếu mượn (`BAN_DAU`), ghi kết quả kiểm tra (`KHI_TRA`) hoặc lưu thiết bị (`THIET_BI`). Ảnh chưa gắn sau 24 giờ bị job `DonAnhMoCo` xóa; ảnh của phiếu đã lập không bao giờ bị xóa (NFR-07).

        Giới hạn: tối đa 2 MB mỗi ảnh (sau nén ở client: cạnh dài tối đa 1280 px, JPEG ~80%); định dạng jpeg/png/webp kiểm tra bằng magic bytes. Vi phạm trả 400 `DU_LIEU_KHONG_HOP_LE`.

        `giaiDoan` quyết định bucket: `THIET_BI` → `thiet-bi-anh` (công khai chỉ đọc); `BAN_DAU`, `KHI_TRA` → `tinh-trang-anh` (riêng tư).
      x-uc:
      - UC-07
      - UC-08
      - UC-12
      x-tham-chieu: KT 6.1, 11; FR-10, FR-12
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaiAnhRequest'
      responses:
        '201':
          description: Đã tải ảnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaiAnhResponse'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenNhanVien'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/sv/tra-cuu/thiet-bi:
    get:
      tags:
      - Sinh viên
      operationId: svTraCuuThietBi
      summary: Tra cứu thiết bị
      description: |-
        **Chính sách:** `SinhVien`.

        Kết quả theo loại thiết bị và phòng kèm số lượng khả dụng (BR-20). Thiết bị hư hỏng tính là hết hàng; chỉ thiết bị `SAN_SANG` được tính. Không có kết quả trả danh sách rỗng.

        **Sắp xếp mặc định:** `tenLoai`, `tenPhong` tăng dần, khóa phụ là mã (khóa chính) tăng dần để phân trang ổn định (ĐX-API-28).
      x-uc:
      - UC-01
      x-tham-chieu: KT 6.3; FR-01, FR-02
      parameters:
      - name: ten
        in: query
        required: false
        description: Tên loại thiết bị chứa chuỗi này
        schema:
          type: string
      - name: maLoai
        in: query
        required: false
        description: Lọc theo loại thiết bị
        schema:
          type: string
          format: uuid
      - name: maPhong
        in: query
        required: false
        description: Lọc theo phòng thiết bị
        schema:
          type: string
          format: uuid
      - name: conHang
        in: query
        required: false
        description: 'true: còn hàng (khả dụng > 0); false: hết hàng'
        schema:
          type: boolean
      - $ref: '#/components/parameters/Trang'
      - $ref: '#/components/parameters/KichThuoc'
      responses:
        '200':
          description: Danh sách kết quả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraCuuThietBiItemPage'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenSinhVien'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/sv/tra-cuu/thiet-bi/{maLoai}:
    get:
      tags:
      - Sinh viên
      operationId: svTraCuuThietBiChiTiet
      summary: Chi tiết loại thiết bị tại một phòng
      description: |-
        **Chính sách:** `SinhVien`.

        Thông số, ảnh, số lượng khả dụng; hết hàng thì trả `ngayDuKienCoSan` (ĐX-KT-05). Còn hàng: đặt trước (`POST /sv/phieu-yeu-cau-muon`). Hết hàng: đăng ký chờ (`POST /sv/dang-ky-cho`).
      x-uc:
      - UC-01
      x-tham-chieu: KT 6.3; FR-02
      parameters:
      - $ref: '#/components/parameters/MaLoaiTraCuu'
      - name: maPhong
        in: query
        required: true
        description: Phòng thiết bị cần xem số lượng khả dụng
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraCuuThietBiChiTiet'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenSinhVien'
        '404':
          $ref: '#/components/responses/KhongTimThay'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/sv/phieu-yeu-cau-muon:
    post:
      tags:
      - Sinh viên
      operationId: svGuiPhieuYeuCauMuon
      summary: Gửi phiếu yêu cầu mượn (đặt trước)
      description: |-
        **Chính sách:** `SinhVien`.

        Kiểm tra thẻ còn hạn, nhóm, quyền mượn, số lượng khả dụng, giới hạn tổng số thiết bị của nhóm và thời gian mượn tối đa (nhỏ nhất theo các loại trong phiếu, áp dụng ngoại lệ theo loại). Hợp lệ thì tạo phiếu `CHO_DUYET`, chưa giữ chỗ, chưa gán thiết bị. Sinh viên bị `TAM_KHOA` hoặc `CAM_MUON_DAI_HAN` bị chặn (ĐX-PQ-08).
      x-uc:
      - UC-02
      - SSD-01
      x-tham-chieu: KT 6.3; BR-21, BR-23..BR-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiYeuCauMuonRequest'
      responses:
        '201':
          description: Đã tạo phiếu yêu cầu `CHO_DUYET`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhieuYeuCauMuon'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenSinhVien'
        '409':
          description: |-
            Xung đột. Mã lỗi (`maLoi`):
            - `SO_LUONG_KHA_DUNG_THAY_DOI`: Số lượng khả dụng đã thay đổi, không còn đủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: |-
            Vi phạm quy tắc nghiệp vụ. Mã lỗi (`maLoi`):
            - `SV_THE_HET_HAN`: Thẻ sinh viên đã hết hạn
            - `SV_KHONG_CON_THEO_HOC`: Sinh viên không còn theo học
            - `SV_BI_KHOA_QUYEN_MUON`: Quyền mượn của sinh viên đang bị khóa
            - `VUOT_GIOI_HAN_THIET_BI`: Vượt giới hạn số thiết bị của nhóm sinh viên
            - `VUOT_THOI_GIAN_MUON_TOI_DA`: Vượt thời gian mượn tối đa của nhóm sinh viên
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/LoiHeThong'
    get:
      tags:
      - Sinh viên
      operationId: svDsPhieuYeuCauMuon
      summary: Danh sách phiếu yêu cầu của tôi
      description: |-
        **Chính sách:** `SinhVien`.

        Chỉ phiếu của chính sinh viên (mã lấy từ claim `sub`).

        **Sắp xếp mặc định:** `thoiGianGui` giảm dần (mới nhất trước), khóa phụ là mã (khóa chính) tăng dần để phân trang ổn định (ĐX-API-28).
      x-uc:
      - UC-02
      x-tham-chieu: KT 6.3
      parameters:
      - $ref: '#/components/parameters/Trang'
      - $ref: '#/components/parameters/KichThuoc'
      responses:
        '200':
          description: Danh sách phiếu yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhieuYeuCauMuonPage'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenSinhVien'
        '500':
          $ref: '#/components/responses/LoiHeThong'
  /api/v1/sv/phieu-yeu-cau-muon/{ma}:
    get:
      tags:
      - Sinh viên
      operationId: svChiTietPhieuYeuCauMuon
      summary: Chi tiết phiếu yêu cầu của tôi
      description: |-
        **Chính sách:** `SinhVien`.

