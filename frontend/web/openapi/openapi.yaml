      required:
      - phiTreMoiNgay
    PhiTre:
      type: object
      properties:
        maLoai:
          type: string
          format: uuid
        phiTreMoiNgay:
          type: integer
          format: int64
          minimum: 0
          description: Số tiền (VNĐ), số nguyên, không có phần lẻ
      required:
      - maLoai
      - phiTreMoiNgay
    NhanVien:
      type: object
