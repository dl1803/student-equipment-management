      - trangThaiKhoa
      - dsPhong
    NhanVienTaoMoiRequest:
      type: object
      properties:
        tenDangNhap:
          type: string
          minLength: 1
          description: Duy nhất; trùng trả 409 `TEN_DANG_NHAP_TRUNG`
        matKhau:
