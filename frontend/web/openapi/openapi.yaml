    post:
      tags:
      - Nhân viên (quầy)
      operationId: quayLapPhieuMuon
      summary: Giao thiết bị và lập phiếu mượn (nguyên tử)
      description: |-
        **Chính sách:** `NhanVien`.

        Một giao dịch duy nhất: khóa dòng sinh viên, kiểm tra điều kiện sinh viên và giới hạn tổng, kiểm tra nguồn (giữ chỗ còn hạn hoặc kiểm tra trực tiếp), gán từng thiết bị bằng `UPDATE ... WHERE tinh_trang = 'SAN_SANG'` (số dòng phải bằng 1), tạo phiếu và chi tiết (lưu `phiTreMoiNgay` và tình trạng ban đầu), chuyển nguồn sang `DA_NHAN`, ghi nhật ký. Lỗi ở bước nào thì hoàn tác toàn bộ.

        `hanTra = min(gioGiao + thoiGianMuon, gioDongCuaCungNgay)`; `thoiGianMuon` là thời gian dự kiến của phiếu yêu cầu, hoặc thời gian mượn tối đa của nhóm khi mượn trực tiếp hoặc giao từ danh sách chờ; luôn không vượt mức tối đa của nhóm. Sinh viên bị khóa quyền mượn bị chặn kể cả mượn trực tiếp và giao từ danh sách chờ (ĐX-PQ-08).
      x-uc:
      - UC-07
      - SSD ghiTinhTrangBanDau + lapPhieuMuon
      x-tham-chieu: KT 6.4, 8.4; BR-38..BR-44, NFR-06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LapPhieuMuonRequest'
      responses:
        '201':
          description: Đã lập phiếu mượn `DANG_MUON`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhieuMuon'
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenNhanVienTheoPhong'
        '409':
          description: |-
            Xung đột. Mã lỗi (`maLoi`):
            - `GIU_CHO_HET_HAN`: Giữ chỗ đã quá hạn, không giao theo phiếu cũ
            - `THIET_BI_DA_DUOC_GIAO`: Thiết bị vừa được giao trong một giao dịch khác
            - `SO_LUONG_KHA_DUNG_THAY_DOI`: Số lượng khả dụng đã thay đổi, không còn đủ
            - `CHUA_CAU_HINH_GIO_QUAY`: Chưa cấu hình giờ mở cửa, đóng cửa quầy
            - `TRANG_THAI_KHONG_HOP_LE`: Chuyển trạng thái trái máy trạng thái
            - `XUNG_DOT_CAP_NHAT`: Dữ liệu vừa bị thay đổi bởi giao dịch khác (concurrency token xmin)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: |-
            Vi phạm quy tắc nghiệp vụ. Mã lỗi (`maLoi`):
            - `SV_THE_HET_HAN`: Thẻ sinh viên đã hết hạn
            - `SV_KHONG_CON_THEO_HOC`: Sinh viên không còn theo học
            - `SV_BI_KHOA_QUYEN_MUON`: Quyền mượn của sinh viên đang bị khóa
            - `VUOT_GIOI_HAN_THIET_BI`: Vượt giới hạn số thiết bị của nhóm sinh viên
            - `THIET_BI_KHONG_SAN_SANG`: Thiết bị không ở tình trạng Sẵn sàng cho mượn
            - `THIET_BI_SAI_PHONG`: Thiết bị không thuộc phòng của phiếu hoặc phòng được cấp quyền
            - `THIET_BI_SAI_LOAI`: Thiết bị không đúng loại đã duyệt
            - `GIAO_SAU_GIO_DONG_CUA`: Thời điểm giao đã từ giờ đóng cửa trở đi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/LoiHeThong'
