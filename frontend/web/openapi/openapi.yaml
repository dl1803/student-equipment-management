      description: Tình trạng kho. Mỗi dòng là một loại thiết bị tại một phòng; số thiết bị theo từng tình trạng. Là ảnh chụp tại thời điểm xuất, **không** lọc theo `tuNgay`, `denNgay`. `tong` bằng tổng năm cột đếm nên khớp 100% dữ liệu thực tế. Báo cáo trống khi không có dữ liệu trong kỳ (`dsDong` rỗng).
      properties:
        loai:
          type: string
          enum:
          - tinh-trang-kho
