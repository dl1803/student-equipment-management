  /api/v1/quan-tri/bao-cao/{loai}:
    get:
      tags:
      - Quản trị viên
      operationId: qtBaoCao
      summary: Xem và xuất báo cáo
      description: |-
        **Chính sách:** `QuanTri`.

        Sáu loại báo cáo: `tinh-trang-kho`, `qua-han`, `hu-hong-mat`, `tan-suat-muon`, `vi-pham-sinh-vien`, `bao-tri-thanh-ly`. Cột và mốc thời gian lọc của từng loại nằm ở schema tương ứng (`BaoCaoTinhTrangKho`, ...) và API-Notes mục 9.

        `tuNgay`, `denNgay` là ngày lịch Asia/Ho_Chi_Minh, gồm cả hai đầu; bỏ trống thì không giới hạn đầu đó; `denNgay` sớm hơn `tuNgay` trả 400 `DU_LIEU_KHONG_HOP_LE`. Không có dữ liệu thì báo cáo trống (`dsDong` rỗng).

        `dinhDang` quyết định kiểu nội dung: `json` (mặc định, `application/json`), `xlsx` (ClosedXML, một trang tính), `csv` (UTF-8). xlsx và csv có đúng các cột của `dsDong`, hàng tiêu đề tiếng Việt.
      x-uc:
      - UC-16
      x-tham-chieu: KT 6.5; BR-81, ĐX-KT-09, ĐX-API-29
      parameters:
      - $ref: '#/components/parameters/LoaiBaoCaoPath'
      - name: tuNgay
        in: query
        required: false
        description: Từ ngày (gồm). Bỏ qua với `tinh-trang-kho`
        schema:
          type: string
          format: date
      - name: denNgay
        in: query
        required: false
        description: Đến ngày (gồm). Bỏ qua với `tinh-trang-kho`
        schema:
          type: string
          format: date
      - name: dinhDang
        in: query
        required: false
        description: Định dạng đầu ra, mặc định `json`
        schema:
          allOf:
          - $ref: '#/components/schemas/DinhDangBaoCao'
          default: json
      responses:
        '200':
          description: Báo cáo. Nội dung theo `dinhDang`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaoCaoJson'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/DuLieuKhongHopLe'
        '401':
          $ref: '#/components/responses/ChuaXacThuc'
        '403':
          $ref: '#/components/responses/KhongDuQuyenNhanVien'
        '404':
          $ref: '#/components/responses/KhongTimThay'
        '500':
          $ref: '#/components/responses/LoiHeThong'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT HS256, hạn 15 phút; claim `sub` (mã người dùng hoặc MSSV), `role`, `jti`.
  parameters:
    Trang:
      name: trang
      in: query
      required: false
      description: Số trang, từ 1. Nhỏ hơn 1 trả 400 `DU_LIEU_KHONG_HOP_LE`
      schema:
        type: integer
        minimum: 1
        default: 1
    KichThuoc:
      name: kichThuoc
      in: query
      required: false
      description: Số phần tử mỗi trang (1 đến 100, mặc định 20). Ngoài khoảng trả 400 `DU_LIEU_KHONG_HOP_LE`
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MaYeuCau:
      name: ma
      in: path
      required: true
      description: Mã phiếu yêu cầu mượn, dạng `YC-yyMMdd-nnnnnn`
      schema:
        type: string
        pattern: ^YC-[0-9]{6}-[0-9]{6,}$
        example: YC-261024-000123
    MaDangKy:
      name: ma
      in: path
      required: true
      description: Mã đăng ký chờ, dạng `DK-yyMMdd-nnnnnn`
      schema:
        type: string
        pattern: ^DK-[0-9]{6}-[0-9]{6,}$
        example: DK-261024-000045
    MaPhieu:
      name: ma
      in: path
      required: true
      description: Mã phiếu mượn, dạng `PM-yyMMdd-nnnnnn`
      schema:
        type: string
        pattern: ^PM-[0-9]{6}-[0-9]{6,}$
        example: PM-261024-000123
    MaBienBan:
      name: ma
      in: path
      required: true
      description: Mã biên bản vi phạm, dạng `BB-yyMMdd-nnnnnn`
      schema:
        type: string
        pattern: ^BB-[0-9]{6}-[0-9]{6,}$
        example: BB-261024-000007
    MaThietBiPath:
      name: maThietBi
      in: path
      required: true
      description: Mã thiết bị (in chìm trên thiết bị; quét hoặc nhập tay)
      schema:
        type: string
        minLength: 1
    MaThietBiQT:
      name: ma
      in: path
      required: true
      description: Mã thiết bị
      schema:
        type: string
        minLength: 1
    MaPhongPath:
      name: ma
      in: path
      required: true
      description: Mã phòng thiết bị
      schema:
        type: string
        format: uuid
    MaLoaiPath:
      name: ma
      in: path
      required: true
      description: Mã loại thiết bị
      schema:
        type: string
        format: uuid
    MaLoaiCauHinh:
      name: maLoai
      in: path
      required: true
      description: Mã loại thiết bị
      schema:
        type: string
        format: uuid
    MaLoaiTraCuu:
      name: maLoai
      in: path
      required: true
      description: Mã loại thiết bị
      schema:
        type: string
        format: uuid
    MaKhungPath:
      name: ma
      in: path
      required: true
      description: Mã khung phạt
      schema:
        type: string
        format: uuid
    MaBaoTriPath:
      name: ma
      in: path
      required: true
      description: Mã bản ghi bảo trì/sửa chữa
      schema:
        type: string
        format: uuid
    MaNguoiDungPath:
      name: ma
      in: path
      required: true
      description: Mã người dùng (`ma_nguoi_dung`) của nhân viên
      schema:
        type: string
        format: uuid
    MaSVPath:
      name: maSV
      in: path
      required: true
      description: Mã số sinh viên
      schema:
        type: string
        minLength: 1
    MaThePath:
      name: maThe
      in: path
      required: true
      description: Nội dung mã thẻ quét được; **là MSSV** (ĐX-KT-05)
      schema:
        type: string
        minLength: 1
    LoaiBaoCaoPath:
      name: loai
      in: path
      required: true
      description: Loại báo cáo
      schema:
        $ref: '#/components/schemas/LoaiBaoCao'
  responses:
    DuLieuKhongHopLe:
      description: |-
        Dữ liệu không hợp lệ. Mã lỗi (`maLoi`):
        - `DU_LIEU_KHONG_HOP_LE`: Dữ liệu vào sai cú pháp hoặc thiếu trường
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    ChuaXacThuc:
      description: |-
        Chưa xác thực. Mã lỗi (`maLoi`):
        - `CHUA_XAC_THUC`: Token thiếu, không hợp lệ hoặc hết hạn; client dùng auth/lam-moi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    KhongDuQuyenSinhVien:
      description: |-
        Không có quyền. Mã lỗi (`maLoi`):
        - `KHONG_DU_QUYEN`: Truy cập chức năng ngoài vai trò, hoặc dữ liệu của người khác
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    KhongDuQuyenNhanVien:
      description: |-
        Không có quyền. Mã lỗi (`maLoi`):
        - `KHONG_DU_QUYEN`: Truy cập chức năng ngoài vai trò, hoặc dữ liệu của người khác
        - `TAI_KHOAN_BI_KHOA`: Tài khoản bị khóa hoặc tạm khóa đăng nhập
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    KhongDuQuyenNhanVienTheoPhong:
      description: |-
        Không có quyền. Mã lỗi (`maLoi`):
        - `KHONG_DU_QUYEN`: Truy cập chức năng ngoài vai trò, hoặc dữ liệu của người khác
        - `TAI_KHOAN_BI_KHOA`: Tài khoản bị khóa hoặc tạm khóa đăng nhập
        - `PHONG_CHUA_CAP_QUYEN`: Nhân viên truy cập đối tượng thuộc phòng chưa được cấp quyền
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    KhongTimThay:
      description: |-
        Không tìm thấy. Mã lỗi (`maLoi`):
        - `KHONG_TIM_THAY`: Mã tài nguyên không tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    QuaNhieuYeuCau:
      description: |-
        Quá nhiều yêu cầu. Mã lỗi (`maLoi`):
        - `QUA_NHIEU_YEU_CAU`: Vượt giới hạn tần suất trên /auth/*
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LoiHeThong:
      description: Lỗi hệ thống. Không lộ chi tiết nội bộ (SQL, stack trace, chuỗi kết nối); chỉ trả `traceId`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    VaiTro:
      type: string
      description: Vai trò trong token (claim `role`)
      enum:
      - SINH_VIEN
      - NHAN_VIEN
      - QUAN_TRI
    TinhTrangThietBi:
      type: string
      description: ThietBi.tinhTrang
      enum:
      - SAN_SANG
      - DANG_DUOC_MUON
      - DANG_BAO_TRI_SUA_CHUA
      - DA_THANH_LY
      - DA_BAO_MAT
    TrangThaiPhieuYeuCauMuon:
      type: string
      description: PhieuYeuCauMuon.trangThai
      enum:
      - CHO_DUYET
      - DA_DUYET
      - TU_CHOI
      - DA_HUY
      - HET_HAN
      - DA_NHAN
    TrangThaiPhieuMuon:
      type: string
      description: PhieuMuon.trangThai
      enum:
      - DANG_MUON
      - QUA_HAN
      - DA_TRA
    TrangThaiDangKyCho:
      type: string
      description: DangKyCho.trangThai
      enum:
      - DANG_CHO
      - DA_THONG_BAO
      - DA_NHAN
      - DA_HUY
      - HET_HAN
    KetQuaKiemTra:
      type: string
      description: ChiTietPhieuMuon.ketQuaKiemTra
      enum:
      - NGUYEN_VEN
      - HU_HONG
      - THIEU_PHU_KIEN
      - MAT
    TrangThaiBienBan:
      type: string
      description: BienBanViPham.trangThai
      enum:
      - CHUA_NOP
      - DA_NOP
      - DA_HUY
    LoaiViPham:
      type: string
      description: ViPham.loaiViPham
      enum:
      - TRA_TRE
      - HU_HONG
      - MAT
      - KHONG_DEN_NHAN
    LoaiViPhamBienBan:
      type: string
      description: ChiTietBienBan.loaiViPham (không có KHONG_DEN_NHAN). Thiếu phụ kiện được xử lý như HU_HONG
      enum:
      - TRA_TRE
      - HU_HONG
      - MAT
    TrangThaiHoc:
      type: string
      description: SinhVien.trangThaiHoc
      enum:
      - DANG_HOC
      - TOT_NGHIEP
      - THOI_HOC
      - DINH_CHI
    TrangThaiQuyenMuon:
      type: string
      description: SinhVien.trangThaiQuyenMuon
      enum:
      - BINH_THUONG
      - TAM_KHOA
      - CAM_MUON_DAI_HAN
    TrangThaiKhoa:
      type: string
      description: NguoiDungHeThong.trangThaiKhoa
      enum:
      - HOAT_DONG
      - TAM_KHOA_DANG_NHAP
      - BI_KHOA
    LoaiThucHienBaoTri:
      type: string
      description: BaoTriSuaChua.loaiThucHien
      enum:
      - BAO_TRI_DINH_KY
      - SUA_CHUA
    KetQuaBaoTri:
      type: string
      description: BaoTriSuaChua.ketQua
      enum:
      - DUA_VE_SAN_SANG
      - DE_XUAT_THANH_LY
    LoaiThongBao:
      type: string
      description: ThongBao.loaiThongBao
      enum:
      - NHAC_HAN_TRA
      - QUA_HAN
      - THIET_BI_CHO_SAN_SANG
      - DUYET_HOAC_TU_CHOI
      - VI_PHAM_PHI_PHAT
      - NHAC_NHO_NV
      - NHAC_BAO_TRI
    GiaiDoanAnh:
      type: string
      description: Giai đoạn ảnh (luu_tru.anh_tai_len.giai_doan)
      enum:
      - BAN_DAU
      - KHI_TRA
      - THIET_BI
    LoaiBaoCao:
      type: string
      description: Loại báo cáo (KT 6.5)
      enum:
      - tinh-trang-kho
      - qua-han
      - hu-hong-mat
      - tan-suat-muon
      - vi-pham-sinh-vien
      - bao-tri-thanh-ly
    DinhDangBaoCao:
      type: string
      description: Định dạng báo cáo (ĐX-KT-09)
      enum:
      - json
      - xlsx
      - csv
    MaLoi:
      type: string
      description: Mã lỗi nghiệp vụ ổn định (KT 6.6). Client dựa vào `maLoi`, không phân tích `detail`.
      enum:
      - DANG_NHAP_SAI
      - CHUA_XAC_THUC
      - TAI_KHOAN_BI_KHOA
      - KHONG_DU_QUYEN
      - PHONG_CHUA_CAP_QUYEN
      - SV_THE_HET_HAN
      - SV_KHONG_CON_THEO_HOC
      - SV_BI_KHOA_QUYEN_MUON
      - VUOT_GIOI_HAN_THIET_BI
      - VUOT_THOI_GIAN_MUON_TOI_DA
      - CON_HANG_KHONG_DANG_KY_CHO
      - THIET_BI_KHONG_SAN_SANG
      - THIET_BI_SAI_PHONG
      - THIET_BI_SAI_LOAI
      - THIET_BI_KHONG_THUOC_PHIEU
      - THIEU_MO_TA_HOAC_KHUNG_PHAT
      - GIA_TRI_CAU_HINH_KHONG_HOP_LE
      - GIAO_SAU_GIO_DONG_CUA
      - SO_LUONG_KHA_DUNG_THAY_DOI
      - GIU_CHO_HET_HAN
      - THIET_BI_DA_DUOC_GIAO
      - TRANG_THAI_KHONG_HOP_LE
      - MA_THIET_BI_TRUNG
      - TEN_DANG_NHAP_TRUNG
      - MA_NV_TRUNG
      - KHUNG_PHAT_DA_DUNG_KHONG_XOA
      - CHUA_CAU_HINH_GIO_QUAY
      - XUNG_DOT_CAP_NHAT
      - DA_CO_LICH_SU_CHI_NGUNG_SU_DUNG
      - DU_LIEU_KHONG_HOP_LE
      - KHONG_TIM_THAY
      - QUA_NHIEU_YEU_CAU
    ProblemDetails:
      type: object
      description: Lỗi theo RFC 9457 (`application/problem+json`) do một middleware duy nhất tạo ra, kèm `maLoi` và `traceId`. Lỗi 500 không có `maLoi` và không lộ chi tiết nội bộ.
      properties:
        type:
          type: string
          example: about:blank
          description: URI định danh loại lỗi
        title:
          type: string
          description: Tiêu đề ngắn của lỗi
        status:
          type: integer
          description: Mã HTTP
        detail:
          type: string
          description: Mô tả chi tiết; chỉ để hiển thị/ghi log, không dùng để phân nhánh xử lý
        instance:
          type: string
          description: Đường dẫn yêu cầu gây lỗi
        maLoi:
          $ref: '#/components/schemas/MaLoi'
        traceId:
          type: string
          description: Mã truy vết của yêu cầu (trùng với log Serilog)
      required:
      - status
      - traceId
      example:
        type: about:blank
        title: Xung đột
        status: 409
        detail: Chuyển trạng thái trái máy trạng thái
        maLoi: TRANG_THAI_KHONG_HOP_LE
        traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    ValidationProblemDetails:
      description: Lỗi 400 `DU_LIEU_KHONG_HOP_LE`; danh sách trường lỗi nằm trong `errors` (theo `ValidationProblemDetails` của ASP.NET Core).
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        properties:
          errors:
            type: object
            description: Từ khóa trường → danh sách thông báo lỗi
            additionalProperties:
              type: array
              items:
                type: string
      example:
        type: about:blank
        title: Dữ liệu không hợp lệ
        status: 400
        maLoi: DU_LIEU_KHONG_HOP_LE
        errors:
          dsLoaiVaSoLuong[0].soLuong:
          - Số lượng phải lớn hơn 0.
        traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    LyDo:
      type: object
      description: Một lý do không đạt điều kiện (dùng mã lỗi có sẵn của KT 6.6)
      properties:
        maLoi:
          $ref: '#/components/schemas/MaLoi'
        thongDiep:
          type: string
          description: Thông điệp hiển thị
      required:
      - maLoi
      - thongDiep
    AnhRef:
      type: object
      description: Ảnh đính kèm; không trả khóa lưu trữ
      properties:
        maAnh:
          type: string
          format: uuid
          description: Mã ảnh
        url:
          type: string
          format: uri
          description: URL ảnh. Ảnh danh mục (bucket `thiet-bi-anh`) là URL công khai chỉ đọc; ảnh tình trạng (bucket `tinh-trang-anh`) là URL có chữ ký, hết hạn sau 10 phút, chỉ cấp sau khi kiểm tra quyền
      required:
      - maAnh
      - url
    PhongThietBi:
      type: object
      description: Phòng thiết bị (DM-08)
      properties:
        maPhong:
          type: string
          format: uuid
        tenPhong:
          type: string
        coSo:
          type: string
          description: Cơ sở mà phòng thuộc về
      required:
      - maPhong
      - tenPhong
      - coSo
    SinhVienTomTat:
      type: object
      description: Thông tin tóm tắt của sinh viên
      properties:
        maSV:
          type: string
          description: Mã số sinh viên (khóa nghiệp vụ, cũng là nội dung mã thẻ quét)
        hoTen:
          type: string
        lop:
          type: string
          nullable: true
      required:
      - maSV
      - hoTen
    ThietBiTomTat:
      type: object
      description: Thiết bị (tóm tắt)
      properties:
        maThietBi:
          type: string
        tenThietBi:
          type: string
      required:
      - maThietBi
      - tenThietBi
    LoaiVaSoLuongRequest:
      type: object
      description: Một dòng loại thiết bị và số lượng
      properties:
        maLoai:
          type: string
          format: uuid
          description: Loại thiết bị
        soLuong:
          type: integer
          minimum: 1
          description: Số lượng, lớn hơn 0
      required:
      - maLoai
      - soLuong
    LoaiVaSoLuong:
      type: object
      description: Một dòng loại thiết bị và số lượng
      properties:
        maLoai:
          type: string
          format: uuid
        tenLoai:
          type: string
        soLuong:
          type: integer
          minimum: 1
      required:
      - maLoai
      - tenLoai
      - soLuong
    DangNhapSinhVienRequest:
      type: object
      description: Đăng nhập sinh viên, xác thực qua `ISchoolDirectory` (KT 7.1)
      properties:
        mssv:
          type: string
          minLength: 1
          description: Mã số sinh viên (tài khoản của trường)
        matKhau:
          type: string
          minLength: 1
          format: password
          description: Mật khẩu của trường; không được lưu hay ghi log
      required:
      - mssv
      - matKhau
    DangNhapNhanVienRequest:
      type: object
      description: Đăng nhập nhân viên hoặc quản trị viên (dùng chung)
      properties:
        tenDangNhap:
          type: string
          minLength: 1
        matKhau:
          type: string
          minLength: 1
          format: password
      required:
      - tenDangNhap
      - matKhau
    LamMoiRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Refresh token hiện có
      required:
      - refreshToken
    DangXuatRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Refresh token cần thu hồi
      required:
      - refreshToken
    TokenResponse:
      type: object
      description: Cặp token. Không dùng cookie; refresh token gửi qua body (KT 7.3)
      properties:
        accessToken:
          type: string
          description: JWT HS256, hạn 15 phút; claim `sub`, `role`, `jti`
        refreshToken:
          type: string
          description: Ngẫu nhiên, hạn 7 ngày, xoay vòng mỗi lần làm mới
        vaiTro:
          $ref: '#/components/schemas/VaiTro'
      required:
      - accessToken
      - refreshToken
      - vaiTro
    ThongTinToi:
      type: object
      description: Vai trò và danh sách phòng được cấp quyền của người đăng nhập
      properties:
        maNguoiDung:
          type: string
          format: uuid
        vaiTro:
          $ref: '#/components/schemas/VaiTro'
        tenDangNhap:
          type: string
        hoTen:
          type: string
        dsPhong:
          type: array
          items:
            $ref: '#/components/schemas/PhongThietBi'
          description: Phòng được cấp quyền (nhân viên). Quản trị viên không giới hạn theo phòng nên danh sách rỗng
      required:
      - maNguoiDung
      - vaiTro
      - tenDangNhap
      - hoTen
      - dsPhong
    TaiAnhRequest:
      type: object
      description: Tải ảnh (multipart/form-data)
      properties:
        file:
          type: string
          format: binary
          description: Tệp ảnh `image/jpeg`, `image/png` hoặc `image/webp`; tối đa 2 MB sau nén. Server kiểm tra chữ ký tệp (magic bytes), không tin phần mở rộng hay `Content-Type`
        giaiDoan:
          $ref: '#/components/schemas/GiaiDoanAnh'
      required:
      - file
      - giaiDoan
    TaiAnhResponse:
      type: object
      properties:
        maAnh:
          type: string
          format: uuid
          description: Mã ảnh; đưa vào `dsMaAnh` khi lập phiếu mượn, ghi kết quả kiểm tra hoặc lưu thiết bị
      required:
      - maAnh
    PhongThietBiRequest:
      type: object
      properties:
        tenPhong:
          type: string
          minLength: 1
        coSo:
          type: string
          minLength: 1
          description: Cơ sở mà phòng thuộc về
      required:
      - tenPhong
      - coSo
    LoaiThietBi:
      type: object
      description: Loại thiết bị (DM-09)
      properties:
        maLoai:
          type: string
          format: uuid
        tenLoai:
          type: string
        moTa:
          type: string
          nullable: true
        hangSanXuat:
          type: string
          nullable: true
        chuKyBaoTri:
          type: integer
          minimum: 1
          description: Chu kỳ bảo trì (ngày), lớn hơn 0
        phiTreMoiNgay:
          type: integer
          format: int64
          minimum: 0
          description: Phí trả trễ (VNĐ/ngày) của loại, không âm
        ngungSuDung:
          type: boolean
          description: Cờ ngưng sử dụng thay cho xóa cứng khi đã có lịch sử (BR-18)
      required:
      - maLoai
      - tenLoai
      - chuKyBaoTri
      - phiTreMoiNgay
      - ngungSuDung
    LoaiThietBiTaoMoiRequest:
      type: object
      properties:
        tenLoai:
          type: string
          minLength: 1
        moTa:
          type: string
          nullable: true
        hangSanXuat:
          type: string
          nullable: true
        chuKyBaoTri:
          type: integer
          minimum: 1
          description: Chu kỳ bảo trì (ngày), lớn hơn 0; không có giá trị mặc định
        phiTreMoiNgay:
          type: integer
          format: int64
          minimum: 0
          description: Phí trả trễ (VNĐ/ngày), không âm; không có mức mặc định (ĐX-DB-04)
      required:
      - tenLoai
      - chuKyBaoTri
      - phiTreMoiNgay
    LoaiThietBiCapNhatRequest:
      type: object
      description: Phí trả trễ không sửa tại đây mà qua `PUT /cau-hinh/phi-tre/{maLoai}`
      properties:
        tenLoai:
          type: string
          minLength: 1
        moTa:
          type: string
          nullable: true
        hangSanXuat:
          type: string
          nullable: true
        chuKyBaoTri:
          type: integer
          minimum: 1
          description: Chu kỳ bảo trì (ngày), lớn hơn 0
      required:
      - tenLoai
      - chuKyBaoTri
    NhaCungCap:
      type: object
      description: Nhà cung cấp (DM-12), giai đoạn 1 chỉ đọc và gán (ĐX-KT-11)
      properties:
        maNCC:
          type: string
          format: uuid
        tenNCC:
          type: string
        thongTinLienHe:
          type: string
          nullable: true
      required:
      - maNCC
      - tenNCC
    ThietBi:
      type: object
      description: Một đơn vị vật lý có mã riêng, thuộc một loại và một phòng (DM-10). `tinhTrang` chỉ đổi qua máy trạng thái, không có endpoint ghi trực tiếp
      properties:
        maThietBi:
          type: string
          description: Mã thiết bị in chìm, duy nhất, bất biến sau khi tạo
        maLoai:
          type: string
          format: uuid
        tenLoai:
          type: string
        maPhong:
          type: string
          format: uuid
        tenPhong:
          type: string
        tenThietBi:
          type: string
        moTa:
          type: string
          nullable: true
        thongSoKyThuat:
          type: string
          nullable: true
        ngayNhapKho:
          type: string
          format: date
        thoiHanBaoHanh:
          type: string
          format: date
          nullable: true
          description: Ngày hết hạn bảo hành; rỗng nếu không có bảo hành
        tinhTrang:
          $ref: '#/components/schemas/TinhTrangThietBi'
        viTriKe:
          type: string
          nullable: true
          description: Kệ lưu trữ
        viTriTu:
          type: string
          nullable: true
          description: Tủ lưu trữ
        ngungSuDung:
          type: boolean
          description: Thiết bị ngưng sử dụng không tính vào số lượng khả dụng
        giaTriHienHanh:
          type: integer
          format: int64
          minimum: 0
          description: Giá trị hiện hành = bản ghi mới nhất của lịch sử giá trị
        dsNhaCungCap:
          type: array
          items:
            $ref: '#/components/schemas/NhaCungCap'
        dsAnh:
          type: array
          items:
            $ref: '#/components/schemas/AnhRef'
          maxItems: 5
          description: Ảnh danh mục (tối đa 5)
      required:
      - maThietBi
      - maLoai
      - tenLoai
      - maPhong
      - tenPhong
      - tenThietBi
      - ngayNhapKho
      - tinhTrang
      - ngungSuDung
      - giaTriHienHanh
      - dsNhaCungCap
      - dsAnh
    ThietBiTaoMoiRequest:
      type: object
      properties:
        maThietBi:
          type: string
          minLength: 1
          description: Mã thiết bị duy nhất; trùng trả 409 `MA_THIET_BI_TRUNG`
        maLoai:
          type: string
          format: uuid
        maPhong:
          type: string
          format: uuid
        tenThietBi:
          type: string
          minLength: 1
        moTa:
          type: string
          nullable: true
        thongSoKyThuat:
          type: string
          nullable: true
        ngayNhapKho:
          type: string
          format: date
          description: Mốc tính hạn bảo trì khi chưa có lần bảo trì định kỳ
        thoiHanBaoHanh:
          type: string
          format: date
          nullable: true
          description: Ngày hết hạn bảo hành; bỏ trống nếu không có
        viTriKe:
          type: string
          nullable: true
        viTriTu:
          type: string
          nullable: true
        dsMaNCC:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          description: Nhà cung cấp được gán cho thiết bị (nhiều-nhiều)
        dsMaAnh:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
          uniqueItems: true
          description: Ảnh danh mục đã tải qua `POST /api/v1/anh` với `giaiDoan = THIET_BI` (tối đa 5)
        giaTri:
          type: integer
          format: int64
          minimum: 0
          description: Giá trị ban đầu (VNĐ), ghi thành bản ghi đầu tiên của lịch sử giá trị
      required:
      - maThietBi
      - maLoai
      - maPhong
      - tenThietBi
      - ngayNhapKho
      - giaTri
    ThietBiCapNhatRequest:
      type: object
      description: Cập nhật thông tin danh mục. Không đổi mã, tình trạng hay giá trị (giá trị dùng `PUT /thiet-bi/{ma}/gia-tri`)
      properties:
        maLoai:
          type: string
          format: uuid
        maPhong:
          type: string
          format: uuid
        tenThietBi:
          type: string
          minLength: 1
        moTa:
          type: string
          nullable: true
        thongSoKyThuat:
          type: string
          nullable: true
        ngayNhapKho:
          type: string
          format: date
          description: Mốc tính hạn bảo trì khi chưa có lần bảo trì định kỳ
        thoiHanBaoHanh:
          type: string
          format: date
          nullable: true
          description: Ngày hết hạn bảo hành; bỏ trống nếu không có
        viTriKe:
          type: string
          nullable: true
        viTriTu:
          type: string
          nullable: true
        dsMaNCC:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          description: Nhà cung cấp được gán cho thiết bị (nhiều-nhiều)
        dsMaAnh:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
          uniqueItems: true
          description: Ảnh danh mục đã tải qua `POST /api/v1/anh` với `giaiDoan = THIET_BI` (tối đa 5)
      required:
      - maLoai
      - maPhong
      - tenThietBi
      - ngayNhapKho
    GiaTriThietBiRequest:
      type: object
      properties:
        giaTri:
          type: integer
          format: int64
          minimum: 0
          description: Giá trị mới (VNĐ), không âm
      required:
      - giaTri
    GiaTriThietBi:
      type: object
      description: Một bản ghi lịch sử giá trị (DM-11)
      properties:
        maThietBi:
          type: string
        giaTri:
          type: integer
          format: int64
          minimum: 0
          description: Số tiền (VNĐ), số nguyên, không có phần lẻ
        ngayCapNhat:
          type: string
          format: date-time
          description: Thời điểm QT cập nhật
      required:
      - maThietBi
      - giaTri
      - ngayCapNhat
    NgoaiLeTheoLoai:
      type: object
      properties:
        maLoai:
          type: string
          format: uuid
        tenLoai:
          type: string
        thoiGianMuonToiDaGio:
          type: integer
          description: Thời gian mượn tối đa (giờ) cho loại này
      required:
      - maLoai
      - tenLoai
      - thoiGianMuonToiDaGio
    QuyDinhNhom:
      type: object
      description: Quy định mượn của một nhóm sinh viên (DM-06)
      properties:
        maNhom:
          type: string
          description: Mã nhóm do nhà trường cung cấp (ví dụ DAI_HOC, CAO_HOC, DO_AN_TOT_NGHIEP)
        tenNhom:
          type: string
        soThietBiToiDa:
          type: integer
          description: Số thiết bị tối đa mượn cùng lúc, tính trên tổng không phân biệt loại
        thoiGianMuonToiDaGio:
          type: integer
          description: Thời gian mượn tối đa (giờ) của nhóm
        dsNgoaiLeTheoLoai:
          type: array
          items:
            $ref: '#/components/schemas/NgoaiLeTheoLoai'
          description: Ngoại lệ thời gian mượn theo loại thiết bị
      required:
      - maNhom
      - tenNhom
      - soThietBiToiDa
      - thoiGianMuonToiDaGio
      - dsNgoaiLeTheoLoai
    QuyDinhMuonResponse:
      type: object
      description: Quy định mượn của mọi nhóm sinh viên (nhóm do nhà trường cung cấp, QT không tạo nhóm)
      properties:
        dsNhom:
          type: array
          items:
            $ref: '#/components/schemas/QuyDinhNhom'
      required:
      - dsNhom
    CapNhatQuyDinhMuonRequest:
      type: object
      description: 'Thay thế toàn bộ quy định của MỘT nhóm: dòng chung và danh sách ngoại lệ theo loại (loại không có trong danh sách thì không còn ngoại lệ)'
      properties:
        maNhom:
          type: string
          minLength: 1
          description: Nhóm cần cấu hình; phải là nhóm đã có (QT không tạo nhóm)
        soThietBiToiDa:
          type: integer
          description: Phải lớn hơn 0
        thoiGianMuonToiDaGio:
          type: integer
          description: Phải lớn hơn 0
        dsNgoaiLeTheoLoai:
          type: array
          items:
            type: object
            properties:
              maLoai:
                type: string
                format: uuid
              thoiGianMuonToiDaGio:
                type: integer
                description: Phải lớn hơn 0
            required:
            - maLoai
            - thoiGianMuonToiDaGio
          description: Ngoại lệ theo loại; mỗi loại tối đa một dòng
      required:
      - maNhom
      - soThietBiToiDa
      - thoiGianMuonToiDaGio
      - dsNgoaiLeTheoLoai
    ThamSoHeThong:
      type: object
      description: Bộ tham số hệ thống, một dòng duy nhất (DM-07). Giá trị mới chỉ áp dụng cho giao dịch phát sinh sau (không hồi tố). Vi phạm ràng buộc trả 422 `GIA_TRI_CAU_HINH_KHONG_HOP_LE`
      properties:
        soNgayKhoa:
          type: integer
          description: Số ngày quá hạn vượt quá thì khóa quyền mượn mới (soNgayKhoa), không âm; mặc định 3
        thoiGianGiuChoPhut:
          type: integer
          description: Thời gian giữ chỗ (phút), lớn hơn 0; mặc định 30
        anHanPhut:
          type: integer
          description: Ân hạn sau hạn trả (phút), không âm; mặc định 15
        soGioGiaHanToiDa:
          type: integer
          description: Số giờ gia hạn tối đa, lớn hơn 0; mặc định 2
        nguongViPham:
          type: integer
          description: Ngưỡng vi phạm mỗi học kỳ, lớn hơn 0; mặc định 3
        soLanDangNhapSaiToiDa:
          type: integer
          description: Số lần nhập sai mật khẩu tối đa của NV/QT, lớn hơn 0; mặc định 5
        gioMoCua:
          type: string
          nullable: true
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: 07:30:00
          description: Giờ mở cửa quầy (giờ Việt Nam, `HH:mm[:ss]`). Rỗng = chưa cấu hình; không có mặc định (ĐX-03)
        gioDongCua:
          type: string
          nullable: true
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: '17:00:00'
          description: Giờ đóng cửa quầy (giờ Việt Nam). Phải cùng rỗng hoặc cùng có giá trị với `gioMoCua`, và `gioMoCua` < `gioDongCua`
      required:
      - soNgayKhoa
      - thoiGianGiuChoPhut
      - anHanPhut
      - soGioGiaHanToiDa
      - nguongViPham
      - soLanDangNhapSaiToiDa
      - gioMoCua
      - gioDongCua
    KhungPhat:
      type: object
      description: 'Khung phạt hư hỏng (DM-21). Mặc định: Nhẹ 15%, Vừa 40%, Nặng 80%'
      properties:
        maKhung:
          type: string
          format: uuid
        tenKhung:
          type: string
        tyLePhanTram:
          type: number
          description: Tỷ lệ bồi thường (% giá trị hiện hành), trong khoảng (0, 100]
        dangSuDung:
          type: boolean
          description: Cờ bật/tắt; KHÔNG phải dấu hiệu khung đã dùng
      required:
      - maKhung
      - tenKhung
      - tyLePhanTram
      - dangSuDung
