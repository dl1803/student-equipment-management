          type: string
          format: date
          nullable: true
        denNgay:
          type: string
          format: date
          nullable: true
        taoLuc:
          type: string
          format: date-time
          description: Thời điểm xuất báo cáo
        dsDong:
          type: array
          items:
            $ref: '#/components/schemas/BaoCaoTinhTrangKhoDong'
      required:
      - loai
      - taoLuc
      - dsDong
