      type: object
      properties:
        tenKhung:
          type: string
          minLength: 1
        tyLePhanTram:
          type: number
          description: Trong khoảng (0, 100]; ngoài khoảng trả 422 `GIA_TRI_CAU_HINH_KHONG_HOP_LE`
