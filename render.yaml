services:
  - type: web
    name: quan-ly-muon-tra-api
    runtime: docker
    plan: free
    branch: develop
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Seed__AdminUser
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: Cors__AllowedOrigins
        value: http://localhost:3000
      - key: Email__Provider
        value: Log
      - key: Scheduler__Bat
        value: "true"

